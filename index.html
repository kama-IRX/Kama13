<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель фильтров</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="page">
    <section class="filters-panel" aria-label="Фильтры категорий">
      <h1 class="visually-hidden">Категории контента</h1>

      <ul class="filters-list">
        <li class="filters-item">
          <button class="filter-btn filter-btn--active active" type="button" aria-pressed="true">Все категории</button>
        </li>
        <li class="filters-item">
          <button class="filter-btn" type="button" aria-pressed="false">Популярное</button>
        </li>
        <li class="filters-item">
          <button class="filter-btn" type="button" aria-pressed="false">Новинки</button>
        </li>
        <li class="filters-item">
          <button class="filter-btn" type="button" aria-pressed="false">Разработка</button>
        </li>
        <li class="filters-item">
          <button class="filter-btn" type="button" aria-pressed="false">Дизайн</button>
        </li>
        <li class="filters-item">
          <button class="filter-btn" type="button" aria-pressed="false">Маркетинг</button>
        </li>
      </ul>
    </section>
  </main>

</body>
</html>
